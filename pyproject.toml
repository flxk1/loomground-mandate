[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-mandate"
description = "Did this run serve the purpose it was given? A mandate, a trajectory, and the comparison between them. Both terms grounded in evidence through the solver's port; the judgement that a step serves or defeats a purpose supplied by whoever can be held to it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# One narrow problem, one dependency. This package sits *above* the reasoning
# kernel: it uses the shared verdict, the OPEN-dominant fold and the injected
# ports, and reaches into no solver internals. It is imported by hosts, never by
# solver, versum or governance.
# Consumed from solver: cross_subsumption.Verdict, issue_aggregation.{IssueAggregate,aggregate_issues},
#   interop.EvidenceRef, ports.EvidenceProvider
#   Every symbol above ships in 0.4.x, but the floor is 0.5: 0.5.0 is the release
#   in which solver no longer carries this package's module. Against 0.4.x a host
#   would install two implementations of the same thing — the extracted package
#   and the solver module it was extracted from. Keep this in the 0.5 line.
dependencies = ["loomground-solver>=0.5,<0.6"]
dynamic = ["version"]

[project.optional-dependencies]
# Exact revisions CI resolves. The reasoning kernel this package sits above,
# plus the two language packs it depends on — pinned rather than ranged, because
# neither is published to an index yet and a range would resolve to nothing.
dev = [
  "loomground-governance @ git+https://github.com/flxk1/loomground-governance@9e91cf8d4b8624fbf017b7a96ec53c3ce366d31e",
  "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@6fc6df578a35be58924e8d3700fb992b24d68bbb",
  "loomground-solver @ git+https://github.com/flxk1/loomground-solver@081dbade2a5837c83d91fedad8f3fe4ab3f26fd4",
  "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-mandate"
Repository = "https://github.com/flxk1/loomground-mandate"
Issues = "https://github.com/flxk1/loomground-mandate/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_mandate._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_mandate*"]

[tool.setuptools.package-data]
loomground_mandate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
